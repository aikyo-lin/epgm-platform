; ==============================================================================
; [ZH] EPGM 机器人边缘端 PlatformIO 编译与依赖配置文件
; [EN] EPGM Robot Edge PlatformIO Build & Dependency Configuration
; ==============================================================================

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; 编译优化与系统宏定义
build_flags = 
    -O2
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -I include

; 串口监视器波特率
monitor_speed = 115200

; 第三方轻量级开源依赖库
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.0
